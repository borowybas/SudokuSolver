<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia rozwiązań</title>
</head>
<body>
    <h1>Historia rozwiązań</h1>
    <p>Witaj, {{ username }}!</p>
    <a href="{{ url_for('index') }}">Powrót do strony głównej</a>
    <br><br>
    <table border="1">
        <tr>
            <th>Data</th>
            <th>Sudoku</th>
            <th>Rozwiązanie</th>
        </tr>
        {% for entry in history %}
        <tr>
            <td>{{ entry['timestamp'] }}</td>
            <td><pre>{{ entry['sudoku_data'] }}</pre></td>
            <td><pre>{{ entry['solved_data'] }}</pre></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
