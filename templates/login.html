<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <link href="{{ url_for('static', filename='styles/index.css')}}" rel="stylesheet"/>
</head>
<body>
    <h1>Logowanie</h1>
    <form method="POST">
        <label for="username">Nazwa użytkownika:</label>
        <input type="text" id="username" name="username" class="in" required>
        <br>
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" class="in" required>
        <br>
        <button type="submit">Zaloguj się</button>
    </form>
    <p>Nie masz konta? <a href="{{ url_for('register') }}">Zarejestruj się</a></p>
</body>
</html>
