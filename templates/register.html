<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>
    <link href="{{ url_for('static', filename='styles/index.css')}}" rel="stylesheet"/>
</head>
<body>
    <h1>Rejestracja</h1>
    <form method="POST">
        <label for="username">Nazwa użytkownika:</label>
        <input type="text" id="username" name="username" class="in" required>
        <br>
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" class="in" required>
        <br>
        <button type="submit">Zarejestruj się</button>
    </form>
    <p>Masz już konto? <a href="{{ url_for('login') }}">Zaloguj się</a></p>
</body>
</html>
